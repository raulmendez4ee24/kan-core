[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "kan-core"
version = "0.1.0"
description = "K'an core runtime"
readme = "README.md"
requires-python = ">=3.11"
dynamic = ["dependencies"]

[tool.setuptools]
include-package-data = true

[tool.setuptools.dynamic]
dependencies = {file = ["requirements.txt"]}

[tool.setuptools.packages.find]
include = [
  "brain*",
  "browser_agent*",
  "config*",
  "desktop_agent*",
  "execution*",
  "integrations*",
  "learning*",
  "recovery*",
  "runner*",
  "routes*",
  "schemas*",
  "tools*",
  "vision*",
  "workers*",
]
